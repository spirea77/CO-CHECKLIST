<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Strategy Master v9</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #050505; --card: #111; --border: #222; --accent: #d4f244; --text: #eee; --muted: #666; --ai-bg: rgba(212, 242, 68, 0.05);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR', sans-serif; background:var(--bg); color:var(--text); padding-bottom:100px; }

/* NAV */
.nav { position:sticky; top:0; z-index:100; background:rgba(5,5,5,0.9); backdrop-filter:blur(15px); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; padding:0 24px; height:60px; }
.nav-logo { font-family:'Space Mono', monospace; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:2px; }
.nav-tabs { display:flex; gap:5px; }
.nav-btn { background:none; border:none; color:var(--muted); padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; border-radius:8px; transition:0.2s; }
.nav-btn.active { color:var(--accent); background:var(--ai-bg); }

.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.page { display:none; animation:fadeIn 0.3s ease; }
.page.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* UI */
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:20px; }
.section-title { font-family:'Space Mono', monospace; font-size:11px; color:var(--accent); letter-spacing:2px; margin-bottom:15px; text-transform:uppercase; }
.grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:15px; }
.field { margin-bottom:15px; }
.field label { display:block; font-size:11px; color:var(--muted); margin-bottom:8px; }

/* CHIPS (수정됨) */
.chip-group { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:15px; }
.chip { padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:12px; cursor:pointer; transition:0.2s; user-select:none; }
.chip:hover { border-color: #444; }
.chip.active { border-color:var(--accent); color:var(--accent); background:var(--ai-bg); font-weight:700; }

input, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:10px; outline:none; font-size:14px; }
input:focus, select:focus { border-color:var(--accent); }

.btn-primary { width:100%; background:var(--accent); color:#000; border:none; padding:16px; border-radius:12px; font-weight:700; cursor:pointer; margin-top:10px; }
.btn-outline { background:none; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; transition:0.2s; }
.btn-outline:hover { color:var(--accent); border-color:var(--accent); }

/* LOG LIST */
.log-item { background:var(--card); border:1px solid var(--border); padding:18px; border-radius:12px; margin-bottom:12px; }
.log-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.log-title { font-weight:700; font-size:15px; margin-bottom:4px; }
.log-meta { font-size:11px; color:var(--muted); }
.log-actions { display:flex; gap:8px; margin-top:10px; }
.log-stats { display:flex; gap:15px; font-family:'Space Mono', monospace; font-size:12px; color:var(--accent); padding-top:10px; border-top:1px solid #222; }

/* ANALYTICS */
.strategy-grid { display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px; }
.strategy-box { background:var(--ai-bg); border:1px solid var(--border); border-radius:16px; padding:20px; border-left: 4px solid var(--accent); }
.strategy-val { font-size:18px; font-weight:900; margin-top:5px; }

.ai-comment-box { background:var(--ai-bg); border:1px solid rgba(212,242,68,0.2); border-left:4px solid var(--accent); padding:20px; border-radius:12px; margin-top:20px; }
.chart-container { position:relative; height:200px; width:100%; }
#video-length-field { display:none; }
#video-length-field.show { display:block; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">BAK-BANJANG LAB</div>
  <div class="nav-tabs">
    <button class="nav-btn active" id="btn-tab-add" onclick="showPage('add', this)">데이터 기록</button>
    <button class="nav-btn" onclick="showPage('list', this)">로그 목록</button>
    <button class="nav-btn" onclick="showPage('analysis', this)">전략 분석</button>
  </div>
</nav>

<div class="container">
  
  <div id="page-add" class="page active">
    <div class="card">
      <div class="section-title" id="form-title">New Content Entry</div>
      <input type="hidden" id="edit-id">
      <div class="grid-2">
        <div class="field"><label>날짜</label><input type="date" id="date"></div>
        <div class="field">
          <label>업로드 시간대</label>
          <select id="time-list">
            <option value="09:00">오전 09:00 (출근)</option>
            <option value="12:00">오후 12:00 (점심)</option>
            <option value="18:00">오후 06:00 (퇴근)</option>
            <option value="21:00">오후 09:00 (휴식)</option>
            <option value="00:00">오전 00:00 (심야)</option>
          </select>
        </div>
      </div>
      <div class="field"><label>제목</label><input type="text" id="title" placeholder="콘텐츠 제목 입력"></div>
      
      <div class="field">
        <label>요일</label>
        <div class="chip-group" id="day-group">
          <div class="chip" data-v="월">월</div><div class="chip" data-v="화">화</div><div class="chip" data-v="수">수</div>
          <div class="chip" data-v="목">목</div><div class="chip" data-v="금">금</div><div class="chip" data-v="토">토</div><div class="chip" data-v="일">일</div>
        </div>
      </div>

      <div class="field">
        <label>플랫폼</label>
        <div class="chip-group" id="platform-group">
          <div class="chip" data-v="Instagram">인스타그램</div><div class="chip" data-v="Facebook">페이스북</div><div class="chip" data-v="Blog">블로그</div><div class="chip" data-v="TikTok">틱톡</div><div class="chip" data-v="YouTube">유튜브</div>
        </div>
      </div>

      <div class="field">
        <label>형식</label>
        <div class="chip-group" id="format-group">
          <div class="chip" data-v="Image">사진</div><div class="chip" data-v="Video">영상</div><div class="chip" data-v="Text">글</div>
        </div>
      </div>
      <div class="field" id="video-length-field"><label>영상 길이(초)</label><input type="number" id="videoLength"></div>

      <div class="field">
        <label>스타일</label>
        <div class="chip-group" id="style-group">
          <div class="chip" data-v="정보전달">📌 정보전달</div><div class="chip" data-v="스토리공유">💬 스토리</div><div class="chip" data-v="질문던지기">❓ 질문</div><div class="chip" data-v="트렌드반응">🔥 트렌드</div><div class="chip" data-v="비하인드">🎬 비하인드</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field"><label>조회수</label><input type="number" id="views"></div>
        <div class="field"><label>저장</label><input type="number" id="saves"></div>
        <div class="field"><label>공유</label><input type="number" id="shares"></div>
        <div class="field"><label>댓글</label><input type="number" id="comments"></div>
      </div>
      <button class="btn-primary" id="btn-save" onclick="saveData()">데이터 기록 및 분석</button>
      <button class="btn-outline" id="btn-cancel" style="display:none; width:100%; margin-top:10px;" onclick="resetForm()">수정 취소</button>
    </div>

    <div class="ai-comment-box" id="ai-box" style="display:none;">
      <div class="ai-header" id="ai-header"></div>
      <div class="ai-body" id="ai-body"></div>
    </div>
  </div>

  <div id="page-list" class="page">
    <div class="card">
      <div class="section-title">Log History</div>
      <button class="btn-outline" onclick="exportCSV()" style="margin-bottom:15px;">CSV 내보내기</button>
      <div id="log-container"></div>
    </div>
  </div>

  <div id="page-analysis" class="page">
    <div class="strategy-grid">
      <div class="strategy-box">
        <span class="section-title">황금 업로드 시간</span>
        <div class="strategy-val" id="rec-time">-</div>
      </div>
      <div class="strategy-box">
        <span class="section-title">필승 콘텐츠 스타일</span>
        <div class="strategy-val" id="rec-style">-</div>
      </div>
    </div>
    <div class="card"><div class="section-title">Weekly Trend</div><div class="chart-container"><canvas id="weeklyChart"></canvas></div></div>
  </div>

</div>

<script>
let entries = JSON.parse(localStorage.getItem('bak_v9_data') || '[]');

// CHIP CLICK LOGIC (개선됨)
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const group = chip.parentElement;
    group.querySelectorAll('.chip').forEach(c => c.classList
