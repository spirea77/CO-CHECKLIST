<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bak-banjang Strategy Lab v11</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --bg: #050505; --card: #111; --border: #222; --accent: #d4f244; --text: #eee; --muted: #666; --ai-bg: rgba(212, 242, 68, 0.05); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR', sans-serif; background:var(--bg); color:var(--text); padding-bottom:100px; scroll-behavior: smooth; }

.nav { position:sticky; top:0; z-index:1000; background:rgba(5,5,5,0.95); backdrop-filter:blur(15px); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; padding:0 24px; height:60px; }
.nav-logo { font-family:'Space Mono', monospace; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:2px; }
.nav-tabs { display:flex; gap:5px; }
.nav-btn { background:none; border:none; color:var(--muted); padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; border-radius:8px; }
.nav-btn.active { color:var(--accent); background:var(--ai-bg); }

.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:20px; }
.section-title { font-family:'Space Mono', monospace; font-size:11px; color:var(--accent); letter-spacing:2px; margin-bottom:15px; text-transform:uppercase; }

.grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:15px; }
.field { margin-bottom:15px; }
.field label { display:block; font-size:11px; color:var(--muted); margin-bottom:8px; }

.chip-group { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:5px; }
.chip { padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:12px; cursor:pointer; transition:0.2s; color: var(--text); }
.chip.active { border-color:var(--accent); color:var(--accent); background:var(--ai-bg); font-weight:700; }

input, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:10px; outline:none; font-size:14px; appearance: none; }
input:focus, select:focus { border-color:var(--accent); }

.btn-primary { width:100%; background:var(--accent); color:#000; border:none; padding:16px; border-radius:12px; font-weight:700; cursor:pointer; margin-top:10px; }
.btn-outline { background:none; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; margin-top:5px; }

.ai-comment-box { background:var(--ai-bg); border:1px solid rgba(212, 242, 68, 0.2); border-left:4px solid var(--accent); padding:24px; border-radius:0 12px 12px 0; margin-top:20px; display:none; }
.ai-header { font-weight:900; color:var(--accent); margin-bottom:12px; font-size:16px; }
.ai-body { font-size:14px; line-height:1.7; color:var(--text); }

.chart-card { display:none; } /* 초기엔 숨김 */
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">BAK-BANJANG LAB v11</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="location.reload()">데이터 기록</button>
    <button class="nav-btn" onclick="alert('목록 기능은 이전 버전과 동일합니다.')">로그 목록</button>
  </div>
</nav>

<div class="container">
  <div class="card">
    <div class="section-title">New Content Entry</div>
    <div class="grid-2">
      <div class="field"><label>날짜</label><input type="date" id="date"></div>
      <div class="field">
        <label>업로드 시간</label>
        <div style="display:flex; gap:5px;">
          <select id="hour-list" style="flex:1;"></select>
          <select id="min-list" style="flex:1;"></select>
        </div>
      </div>
    </div>
    
    <div class="field"><label>제목</label><input type="text" id="title" placeholder="콘텐츠 제목 입력"></div>
    
    <div class="field">
      <label>요일</label>
      <div class="chip-group" id="day-group">
        <div class="chip" data-v="월" onclick="sc(this,'day-group')">월</div><div class="chip" data-v="화" onclick="sc(this,'day-group')">화</div><div class="chip" data-v="수" onclick="sc(this,'day-group')">수</div><div class="chip" data-v="목" onclick="sc(this,'day-group')">목</div><div class="chip" data-v="금" onclick="sc(this,'day-group')">금</div><div class="chip" data-v="토" onclick="sc(this,'day-group')">토</div><div class="chip" data-v="일" onclick="sc(this,'day-group')">일</div>
      </div>
    </div>

    <div class="field">
      <label>플랫폼</label>
      <div class="chip-group" id="platform-group">
        <div class="chip" data-v="Instagram" onclick="sc(this,'platform-group')">인스타그램</div><div class="chip" data-v="Facebook" onclick="sc(this,'platform-group')">페이스북</div><div class="chip" data-v="Blog" onclick="sc(this,'platform-group')">블로그</div><div class="chip" data-v="TikTok" onclick="sc(this,'platform-group')">틱톡</div><div class="chip" data-v="YouTube" onclick="sc(this,'platform-group')">유튜브</div>
      </div>
    </div>

    <div class="field">
      <label>형식</label>
      <div class="chip-group" id="format-group">
        <div class="chip" data-v="Image" onclick="sc(this,'format-group')">사진</div><div class="chip" data-v="Video" onclick="sc(this,'format-group')">영상</div><div class="chip" data-v="Text" onclick="sc(this,'format-group')">글</div>
      </div>
    </div>

    <div class="field">
      <label>스타일</label>
      <div class="chip-group" id="style-group">
        <div class="chip" data-v="정보전달" onclick="sc(this,'style-group')">📌 정보전달</div><div class="chip" data-v="스토리공유" onclick="sc(this,'style-group')">💬 스토리</div><div class="chip" data-v="질문던지기" onclick="sc(this,'style-group')">❓ 질문</div><div class="chip" data-v="트렌드반응" onclick="sc(this,'style-group')">🔥 트렌드</div><div class="chip" data-v="비하인드" onclick="sc(this,'style-group')">🎬 비하인드</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="field"><label>조회수</label><input type="number" id="views" value="0"></div>
      <div class="field"><label>저장</label><input type="number" id="saves" value="0"></div>
      <div class="field"><label>공유</label><input type="number" id="shares" value="0"></div>
      <div class="field"><label>댓글</label><input type="number" id="comments" value="0"></div>
    </div>
    <button class="btn-primary" onclick="save()">데이터 기록 및 분석</button>
  </div>

  <div class="ai-comment-box" id="ai-box">
    <div class="ai-header" id="ai-header"></div>
    <div class="ai-body" id="ai-body"></div>
  </div>

  <div class="card chart-card" id="chart-card">
    <div class="section-title">Weekly Insights</div>
    <div style="height:250px;"><canvas id="weeklyChart"></canvas></div>
  </div>
</div>

<script>
let entries = JSON.parse(localStorage.getItem('bak_v11_data') || '[]');

function sc(el, g) {
  document.getElementById(g).querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function initTime() {
  const h = document.getElementById('hour-list'), m = document.getElementById('min-list');
  for(let i=0; i<24; i++) h.add(new Option(i.toString().padStart(2,'0') + '시', i));
  for(let i=0; i<60; i+=5) m.add(new Option(i.toString().padStart(2,'0') + '분', i));
}

function save() {
  const getV = (g) => document.querySelector(`#${g} .chip.active`)?.dataset.v;
  const data = {
    id: Date.now(), title: document.getElementById('title').value,
    date: document.getElementById('date').value,
    time: `${document.getElementById('hour-list').value}:${document.getElementById('min-list').value}`,
    day: getV('day-group'), platform: getV('platform-group'), style: getV('style-group'),
    views: +document.getElementById('views').value, saves: +document.getElementById('saves').value,
    shares: +document.getElementById('shares').value, comments: +document.getElementById('comments').value
  };

  if(!data.title || !data.platform) return alert('제목과 플랫폼을 선택해주세요.');
  entries.unshift(data);
  localStorage.setItem('bak_v11_data', JSON.stringify(entries));

  showResult(data);
}

function showResult(curr) {
  const box = document.getElementById('ai-box'), header = document.getElementById('ai-header'), body = document.getElementById('ai-body');
  const chartCard = document.getElementById('chart-card');
  
  box.style.display = 'block';
  chartCard.style.display = 'block';

  // AI Logic (Numerical comparison)
  const avgViews = entries.length > 1 ? entries.slice(1).reduce((a,e)=>a+e.views,0)/(entries.length-1) : curr.views;
  const diff = Math.round(((curr.views - avgViews) / (avgViews || 1)) * 100);

  header.innerText = diff >= 0 ? "📈 어제보다 더 나은 오늘의 성장을 포착했습니다!" : "🔋 다음 폭발을 위한 빌드업 구간입니다.";
  body.innerText = `현재 [${curr.title}]의 조회수는 평균 대비 ${Math.abs(diff)}% ${diff >= 0 ? '높습니다' : '낮습니다'}. 
  ${curr.saves > 5 ? '특히 저장수가 눈에 띄네요. 실용적인 정보값이 잘 전달되었다는 뜻입니다.' : '공유 지표를 더 높이려면 질문을 던지는 형식을 섞어보세요.'}
  ${curr.time.split(':')[0] >= 18 ? '저녁 시간대 업로드가 타겟의 체류 시간과 잘 맞아떨어지고 있습니다.' : ''}`;

  renderChart();
  window.scrollTo(0, box.offsetTop - 80);
}

function renderChart() {
  const ctx = document.getElementById('weeklyChart').getContext('2d');
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return d.toISOString().split('T')[0]; }).reverse();
  const data = days.map(d => entries.filter(e => e.date === d).reduce((a, c) => a + c.views, 0));
  if (window.myChart) window.myChart.destroy();
  window.myChart = new Chart(ctx, { type: 'line', data: { labels: days.map(d => d.slice(5)), datasets: [{ data: data, borderColor: '#d4f244', backgroundColor: 'rgba(212,242,68,0.1)', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
}

document.getElementById('date').value = new Date().toISOString().split('T')[0];
initTime();
</script>
</body>
</html>
