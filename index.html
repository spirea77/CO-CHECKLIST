<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Lab Pro v3 | 전략 수립 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --s1: #121212;
  --s2: #1c1c1c;
  --border: #282828;
  --accent: #d4f244;
  --accent-rgb: 212, 242, 68;
  --text: #f0f0f0;
  --muted: #888;
  --info: #7c6af7;
  --okr: #ff8c42;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.6; overflow-x: hidden;
}

/* UI Components */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8, 8, 8, 0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 24px; height: 64px;
}
.nav-logo { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent); font-size: 14px; letter-spacing: 2px; }
.nav-tabs { display: flex; gap: 8px; }
.nav-btn {
  background: none; border: none; color: var(--muted);
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; border-radius: 8px; transition: 0.2s;
}
.nav-btn.active { background: rgba(var(--accent-rgb), 0.1); color: var(--accent); }

.container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.title-group { margin-bottom: 32px; }
.title-group h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
.title-group p { color: var(--muted); font-size: 14px; margin-top: 4px; }

.card { background: var(--s1); border: 1px solid var(--border); border-radius: 20px; padding: 28px; margin-bottom: 24px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card-title { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }

/* Form Styles */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
input, select, textarea {
  background: var(--s2); border: 1px solid var(--border);
  color: var(--text); padding: 12px 16px; border-radius: 12px;
  font-size: 14px; outline: none; transition: 0.2s;
}
input:focus { border-color: var(--accent); }

.btn-main {
  background: var(--accent); color: #000; border: none;
  padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700;
  cursor: pointer; width: 100%; margin-top: 10px;
}

/* Dashboard Widgets */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi-box { background: var(--s1); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-align: center; }
.kpi-val { font-size: 24px; font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent); }
.kpi-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

.style-tag {
  font-size: 10px; padding: 4px 10px; border-radius: 99px;
  border: 1px solid; font-weight: 600; margin-right: 6px;
}

/* OKR Recommender */
.okr-box {
  background: rgba(255, 140, 66, 0.05); border: 1px solid rgba(255, 140, 66, 0.2);
  border-left: 4px solid var(--okr); padding: 24px; border-radius: 0 16px 16px 0;
}
.okr-badge { background: var(--okr); color: #000; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; display: inline-block; }

/* List Item */
.item-card { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 12px; }
.item-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }

</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">STRATEGY LAB v3</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="tab('record')">기록 (KPI)</button>
    <button class="nav-btn" onclick="tab('analysis')">분석 & OKR</button>
    <button class="nav-btn" onclick="tab('list')">로그 목록</button>
  </div>
</nav>

<div class="container">
  
  <div id="page-record" class="page active">
    <div class="title-group">
      <h1>오늘의 콘텐츠 기록</h1>
      <p>지표를 기록하고 어제보다 나은 전략을 도출합니다.</p>
    </div>

    <div class="card">
      <div class="card-title">Basic Info</div>
      <div class="grid">
        <div class="field full"><label>콘텐츠 제목</label><input type="text" id="title" placeholder="ex. 디렉터의 마케팅 팁"></div>
        <div class="field">
          <label>플랫폼</label>
          <select id="platform">
            <option value="YouTube">YouTube (시청지속 중심)</option>
            <option value="Instagram">Instagram (저장/공유 중심)</option>
            <option value="Blog">Blog (체류시간 중심)</option>
          </select>
        </div>
        <div class="field">
          <label>콘텐츠 스타일</label>
          <select id="style">
            <option value="정보전달">📌 정보전달</option>
            <option value="스토리공유">💬 스토리공유</option>
            <option value="질문던지기">❓ 질문던지기</option>
            <option value="트렌드반응">🔥 트렌드반응</option>
            <option value="비하인드">🎬 비하인드</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Metrics (KPI)</div>
      <div class="grid">
        <div class="field"><label>조회수</label><input type="number" id="views"></div>
        <div class="field"><label>플랫폼 핵심지표 (%)</label><input type="number" id="coreMetric" placeholder="지속시간/체류시간/저장율 등"></div>
        <div class="field"><label>저장수</label><input type="number" id="saves"></div>
        <div class="field"><label>공유수</label><input type="number" id="shares"></div>
        <div class="field full">
          <label>OSMU 여부 (다른 플랫폼에도 활용했나요?)</label>
          <select id="osmu"><option value="no">아니오</option><option value="yes">예 (효율성 증가)</option></select>
        </div>
      </div>
      <button class="btn-main" onclick="save()">분석 데이터 저장하기</button>
    </div>
  </div>

  <div id="page-analysis" class="page">
    <div class="title-group">
      <h1>데이터 인사이트</h1>
      <p>지난 기록을 바탕으로 추천 OKR 가설을 생성합니다.</p>
    </div>

    <div class="kpi-grid">
      <div class="kpi-box"><div class="kpi-val" id="totalCount">0</div><div class="kpi-label">총 콘텐츠</div></div>
      <div class="kpi-box"><div class="kpi-val" id="avgViews">0</div><div class="kpi-label">평균 조회수</div></div>
      <div class="kpi-box"><div class="kpi-val" id="avgMetric">0%</div><div class="kpi-label">평균 핵심지표</div></div>
      <div class="kpi-box"><div class="kpi-val" id="osmuRate">0%</div><div class="kpi-label">OSMU 효율</div></div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">Recommended OKR</div></div>
      <div class="okr-box" id="okrRecommendation">
        <div class="okr-badge">STRATEGY RECOMMENDATION</div>
        <h3 style="margin-bottom: 8px;">아직 충분한 데이터가 없습니다.</h3>
        <p style="font-size: 14px; color: var(--muted);">콘텐츠를 3개 이상 기록하면 AI가 다음 달 도전 목표(OKR)를 제안합니다.</p>
      </div>
    </div>
  </div>

  <div id="page-list" class="page">
    <div class="title-group">
      <h1>로그 리스트</h1>
      <p>과거의 실험 데이터를 검토합니다.</p>
    </div>
    <div id="logList"></div>
  </div>

</div>

<script>
let logs = JSON.parse(localStorage.getItem('bak_logs') || '[]');

function tab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
  if(id === 'analysis') renderAnalysis();
  if(id === 'list') renderList();
}

function save() {
  const data = {
    id: Date.now(),
    title: document.getElementById('title').value,
    platform: document.getElementById('platform').value,
    style: document.getElementById('style').value,
    views: Number(document.getElementById('views').value),
    coreMetric: Number(document.getElementById('coreMetric').value),
    saves: Number(document.getElementById('saves').value),
    shares: Number(document.getElementById('shares').value),
    osmu: document.getElementById('osmu').value,
    date: new Date().toLocaleDateString()
  };
  
  if(!data.title) return alert('제목을 입력해주세요.');
  logs.unshift(data);
  localStorage.setItem('bak_logs', JSON.stringify(logs));
  alert('전략 데이터가 기록되었습니다.');
  tab('analysis');
}

function renderAnalysis() {
  const total = logs.length;
  if(total === 0) return;

  const views = Math.round(logs.reduce((acc, cur) => acc + cur.views, 0) / total);
  const metrics = Math.round(logs.reduce((acc, cur) => acc + cur.coreMetric, 0) / total);
  const osmuCount = logs.filter(l => l.osmu === 'yes').length;
  const osmuRate = Math.round((osmuCount / total) * 100);

  document.getElementById('totalCount').innerText = total;
  document.getElementById('avgViews').innerText = views.toLocaleString();
  document.getElementById('avgMetric').innerText = metrics + '%';
  document.getElementById('osmuRate').innerText = osmuRate + '%';

  // OKR Recommendation Logic
  if(total >= 3) {
    const styles = logs.map(l => l.style);
    const mostStyle = styles.sort((a,b) => styles.filter(v => v===a).length - styles.filter(v => v===b).length).pop();
    const avgSaves = logs.reduce((acc, cur) => acc + cur.saves, 0) / total;

    let recTitle = "", recDesc = "";
    if(avgSaves < 5) {
      recTitle = "정보의 밀도를 높이는 가설이 필요합니다.";
      recDesc = `현재 저장수가 평균 ${avgSaves.toFixed(1)}회로 낮습니다. '정보전달' 스타일 콘텐츠에 '체크리스트'나 '나만 아는 비하인드'를 섞어 저장률을 20% 높이는 OKR을 추천합니다.`;
    } else {
      recTitle = `${mostStyle} 스타일의 확산 전략이 필요합니다.`;
      recDesc = `가장 많이 시도한 ${mostStyle}의 반응이 좋습니다. 이를 리퍼포징(OSMU)하여 타 플랫폼 공유수를 2배 늘리는 도전을 시작해보세요.`;
    }

    document.getElementById('okrRecommendation').innerHTML = `
      <div class="okr-badge">STRATEGY RECOMMENDATION</div>
      <h3 style="margin-bottom: 8px;">${recTitle}</h3>
      <p style="font-size: 14px; line-height: 1.6;">${recDesc}</p>
    `;
  }
}

function renderList() {
  const list = document.getElementById('logList');
  list.innerHTML = logs.map(l => `
    <div class="item-card">
      <div class="item-meta">
        <span>${l.date}</span> | <span>${l.platform}</span>
      </div>
      <div style="font-weight: 700; font-size: 16px; margin-bottom: 12px;">${l.title}</div>
      <div style="display: flex; gap: 8px;">
        <span class="style-tag" style="border-color: var(--accent); color: var(--accent);">${l.style}</span>
        <span class="style-tag" style="border-color: var(--muted); color: var(--muted);">OSMU: ${l.osmu}</span>
      </div>
      <div style="margin-top: 12px; font-size: 13px; color: var(--muted);">
        조회수 ${l.views.toLocaleString()} · 지표 ${l.coreMetric}% · 저장 ${l.saves}
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
