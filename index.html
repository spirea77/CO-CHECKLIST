<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Strategy Lab v16</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --bg: #050505; --card: #111; --border: #222; --accent: #d4f244; --text: #eee; --muted: #666; --ai-bg: rgba(212, 242, 68, 0.05); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR', sans-serif; background:var(--bg); color:var(--text); padding-bottom:100px; }

/* NAV */
.nav { position:sticky; top:0; z-index:1000; background:rgba(5,5,5,0.95); backdrop-filter:blur(15px); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; padding:0 24px; height:64px; }
.nav-logo { font-family:'Space Mono', monospace; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:2px; }
.nav-tabs { display:flex; gap:5px; }
.nav-btn { background:none; border:none; color:var(--muted); padding:8px 12px; font-size:11px; font-weight:700; cursor:pointer; border-radius:8px; transition:0.2s; }
.nav-btn.active { color:var(--accent); background:var(--ai-bg); }
.btn-export { background:var(--accent); color:#000; border:none; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; }

.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.page { display:none; animation:fadeIn 0.3s ease; }
.page.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* UI */
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:20px; }
.section-title { font-family:'Space Mono', monospace; font-size:11px; color:var(--accent); letter-spacing:2px; margin-bottom:15px; text-transform:uppercase; }
.grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:15px; }
.field { margin-bottom:15px; }
.field label { display:block; font-size:11px; color:var(--muted); margin-bottom:8px; }

.chip-group { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:5px; }
.chip { padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:12px; cursor:pointer; transition:0.2s; color: var(--text); }
.chip.active { border-color:var(--accent); color:var(--accent); background:var(--ai-bg); font-weight:700; }

input, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:10px; outline:none; font-size:14px; }
.btn-primary { width:100%; background:var(--accent); color:#000; border:none; padding:16px; border-radius:12px; font-weight:700; cursor:pointer; margin-top:10px; }

/* AI & LOGS */
.ai-comment-box { background:var(--ai-bg); border:1px solid rgba(212,242,68,0.2); border-left:4px solid var(--accent); padding:24px; border-radius:12px; margin-top:20px; }
.log-item { background:var(--bg); border:1px solid var(--border); padding:15px; border-radius:12px; margin-bottom:10px; font-size:13px; }
.log-stats { font-family:'Space Mono', monospace; font-size:11px; color:var(--accent); margin-top:8px; display:flex; gap:12px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">STRATEGY LAB v16</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="sp('record', this)">기록</button>
    <button class="nav-btn" onclick="sp('list', this)">로그목록</button>
    <button class="nav-btn" onclick="sp('analysis', this)">전략분석</button>
    <button class="nav-btn" onclick="sp('hypo', this)">가설검증</button>
    <button class="btn-export" onclick="exportCSV()">내보내기</button>
  </div>
</nav>

<div class="container">
  
  <div id="page-record" class="page active">
    <div class="card">
      <div class="section-title">New Entry</div>
      <div class="grid-2">
        <div class="field"><label>날짜 (수정 가능)</label><input type="date" id="date"></div>
        <div class="field"><label>시간 (5분 단위)</label><div style="display:flex;gap:5px;"><select id="hour"></select><select id="min"></select></div></div>
      </div>
      <div class="field"><label>제목</label><input type="text" id="title" placeholder="콘텐츠 제목 입력"></div>
      
      <div class="field">
        <label>플랫폼</label>
        <div class="chip-group" id="platform-group">
          <div class="chip" data-v="인스타그램" onclick="sc(this,'platform-group')">인스타그램</div>
          <div class="chip" data-v="유튜브" onclick="sc(this,'platform-group')">유튜브</div>
          <div class="chip" data-v="블로그" onclick="sc(this,'platform-group')">블로그</div>
          <div class="chip" data-v="페이스북" onclick="sc(this,'platform-group')">페이스북</div>
          <div class="chip" data-v="틱톡" onclick="sc(this,'platform-group')">틱톡</div>
        </div>
      </div>

      <div class="field">
        <label>장르</label>
        <div class="chip-group" id="genre-group">
          <div class="chip" data-v="엔터테인먼트" onclick="sc(this,'genre-group')">🎬 엔터</div>
          <div class="chip" data-v="생활·노하우" onclick="sc(this,'genre-group')">💡 노하우</div>
          <div class="chip" data-v="쇼핑" onclick="sc(this,'genre-group')">🛍️ 쇼핑</div>
          <div class="chip" data-v="취미" onclick="sc(this,'genre-group')">🎨 취미</div>
          <div class="chip" data-v="지식" onclick="sc(this,'genre-group')">🧠 지식</div>
        </div>
      </div>

      <div class="field">
        <label>스타일</label>
        <div class="chip-group" id="style-group">
          <div class="chip" data-v="정보" onclick="sc(this,'style-group')">📌 정보</div>
          <div class="chip" data-v="스토리" onclick="sc(this,'style-group')">💬 스토리</div>
          <div class="chip" data-v="질문" onclick="sc(this,'style-group')">❓ 질문</div>
          <div class="chip" data-v="트렌드" onclick="sc(this,'style-group')">🔥 트렌드</div>
          <div class="chip" data-v="비하인드" onclick="sc(this,'style-group')">🎬 비하인드</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:25px;">KPI Metrics</div>
      <div class="grid-2">
        <div class="field"><label>조회수</label><input type="number" id="views" value="0"></div>
        <div class="field"><label>저장수</label><input type="number" id="saves" value="0"></div>
        <div class="field"><label>공유수</label><input type="number" id="shares" value="0"></div>
        <div class="field"><label>댓글수</label><input type="number" id="comments" value="0"></div>
      </div>
      <button class="btn-primary" onclick="save()">데이터 기록 및 분석</button>
    </div>

    <div class="ai-comment-box" id="ai-box" style="display:none;">
      <div id="ai-header" style="font-weight:900; color:var(--accent); margin-bottom:12px; font-size:16px;"></div>
      <div id="ai-body" style="font-size:14px; line-height:1.7; margin-bottom:20px;"></div>
      <div style="height:200px;"><canvas id="recordChart"></canvas></div>
    </div>
  </div>

  <div id="page-list" class="page">
    <div class="card">
      <div class="section-title">Log History</div>
      <div id="list-container"></div>
    </div>
  </div>

  <div id="page-analysis" class="page">
    <div class="card">
      <div class="section-title">Growth Analysis</div>
      <div id="analysis-text" style="font-size:14px; line-height:1.8;">3개월간의 성과 데이터가 시각화됩니다.</div>
      <div style="height:250px; margin-top:20px;"><canvas id="analysisChart"></canvas></div>
    </div>
  </div>

  <div id="page-hypo" class="page">
    <div class="card">
      <div class="section-title">Hypothesis Verification</div>
      <div class="field"><label>실험 가설</label><input type="text" id="hypo-input" placeholder="실험할 가설을 입력하세요"></div>
      <button class="btn-primary" onclick="startHypo()">실험 스타트 (1개월)</button>
      <div id="hypo-status" style="margin-top:20px;"></div>
    </div>
  </div>

</div>

<script>
let entries = JSON.parse(localStorage.getItem('bak_v16_data') || '[]');
let currentHypo = JSON.parse(localStorage.getItem('bak_v16_hypo') || 'null');
const OKR_GOAL = 100;

function sp(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  if(id === 'list') renderList();
  if(id === 'analysis') renderAnalysis();
  if(id === 'hypo') renderHypo();
}

function sc(el, g) {
  document.getElementById(g).querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function save() {
  const getV = (g) => document.querySelector(`#${g} .chip.active`)?.dataset.v;
  const data = {
    id: Date.now(), title: document.getElementById('title').value,
    date: document.getElementById('date').value,
    time: `${document.getElementById('hour').value}:${document.getElementById('min').value}`,
    platform: getV('platform-group'), genre: getV('genre-group'), style: getV('style-group'),
    views: +document.getElementById('views').value, 
    saves: +document.getElementById('saves').value,
    shares: +document.getElementById('shares').value, 
    comments: +document.getElementById('comments').value
  };

  if(!data.title || !data.platform || !data.genre) return alert('모든 항목을 작성해주세요.');
  entries.unshift(data);
  localStorage.setItem('bak_v16_data', JSON.stringify(entries));
  
  updateAI(data);
  renderGraph('recordChart');
}

function updateAI(curr) {
  const box = document.getElementById('ai-box'), h = document.getElementById('ai-header'), b = document.getElementById('ai-body');
  box.style.display = 'block';

  // AI Coaching Logic based on KPIs
  const avgSaves = entries.length > 1 ? entries.slice(1).reduce((a,e)=>a+e.saves,0)/(entries.length-1) : 0;
  
  h.innerText = "디렉터님의 데이터 코칭";
  if(curr.saves > avgSaves && entries.length > 1) {
    b.innerHTML = `[${curr.title}] 콘텐츠는 저장수(💾 ${curr.saves})가 우수합니다. 시청자가 '소장'할 가치를 느꼈다는 증거입니다. 다음에도 이 깊이를 유지하세요!`;
  } else if(curr.comments > 5) {
    b.innerHTML = `댓글(💬 ${curr.comments}) 반응이 활발합니다. 수강생님의 커뮤니티 장악력이 높아지고 있네요. 댓글에 답글을 달아 체류시간을 더 늘려보세요!`;
  } else {
    b.innerHTML = `오늘의 기록이 성공을 향한 데이터가 됩니다. 조회수(👁 ${curr.views.toLocaleString()}) 추이를 보며 다음 실험을 준비해봅시다.`;
  }
}

function renderList() {
  const cont = document.getElementById('list-container');
  cont.innerHTML = entries.length ? entries.map(e => `
    <div class="log-item">
      <b>${e.title}</b> | ${e.date} ${e.time} | ${e.platform} | ${e.genre}
      <div class="log-stats">
        <span>👁 ${e.views.toLocaleString()}</span>
        <span>💾 ${e.saves}</span>
        <span>🔗 ${e.shares}</span>
        <span>💬 ${e.comments}</span>
      </div>
    </div>
  `).join('') : '<div style="color:var(--muted); text-align:center; padding:40px;">데이터가 없습니다.</div>';
}

function renderAnalysis() {
  if(entries.length < 1) return;
  document.getElementById('analysis-text').innerHTML = `최근 <b>${entries.length}개</b>의 콘텐츠 데이터를 분석 중입니다. 그래프를 통해 조회수 추이를 확인하세요.`;
  renderGraph('analysisChart');
}

function renderGraph(canvasId) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return d.toISOString().split('T')[0]; }).reverse();
  const data = days.map(d => entries.filter(e => e.date === d).reduce((a, c) => a + c.views, 0));
  
  if (window[canvasId + 'Chart']) window[canvasId + 'Chart'].destroy();
  window[canvasId + 'Chart'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: days.map(d => d.slice(5)),
      datasets: [{ label: '조회수', data: data, borderColor: '#d4f244', backgroundColor: 'rgba(212,242,68,0.1)', fill: true, tension: 0.4 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#222' } } } }
  });
}

function startHypo() {
  const text = document.getElementById('hypo-input').value;
  if(!text) return alert('가설을 입력하세요.');
  currentHypo = { text, startDate: new Date().toISOString().split('T')[0] };
  localStorage.setItem('bak_v16_hypo', JSON.stringify(currentHypo));
  renderHypo();
}

function renderHypo() {
  const cont = document.getElementById('hypo-status');
  if(!currentHypo) return cont.innerHTML = "실행 중인 실험이 없습니다.";
  const diff = Math.floor((new Date() - new Date(currentHypo.startDate))/(1000*60*60*24));
  cont.innerHTML = `<div class="hypo-box"><span class="status-tag">D+${diff} 진행중</span><p><b>가설:</b> ${currentHypo.text}</p></div>`;
}

function exportCSV() {
  let csv = "\ufeff날짜,시간,제목,플랫폼,장르,조회수,저장수,공유수,댓글수\n";
  entries.forEach(e => { csv += `${e.date},${e.time},"${e.title}",${e.platform},${e.genre},${e.views},${e.saves},${e.shares},${e.comments}\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `Report-v16.csv`;
  link.click();
}

function init() {
  const h = document.getElementById('hour'), m = document.getElementById('min');
  for(let i=0; i<24; i++) h.add(new Option(i.toString().padStart(2,'0')+'시', i));
  for(let i=0; i<60; i+=5) m.add(new Option(i.toString().padStart(2,'0')+'분', i));
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
}

init();
</script>
</body>
</html>
